<svg viewBox="0 0 580 270" width="580" height="270" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Consolas, Menlo, monospace">

    <style>
      
      .row { opacity: 0; transform: translateX(-10px); animation: printline 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes printline { to { opacity: 1; transform: translateX(0); } }
      .dot { animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.92); } }
      .blink { animation: blinker 1s infinite; fill: #58a6ff; }
      @keyframes blinker { 50% { opacity: 0; } }
      .glow-border { filter: drop-shadow(0px 0px 6px rgba(88, 166, 255, 0.25)); }
    
      .key { fill: #58a6ff; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; }
      .val { fill: #c9d1d9; font-size: 13px; }
      .title { fill: #8b949e; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
    </style>
    <defs>
      <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0d1117" />
        <stop offset="100%" stop-color="#161b22" />
      </linearGradient>
      <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#58a6ff" />
        <stop offset="50%" stop-color="#bc8cff" />
        <stop offset="100%" stop-color="#39d353" />
      </linearGradient>
    </defs>
    
    <rect x="1" y="1" width="578" height="268" rx="12" ry="12"
          fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" class="glow-border" />
    
<circle class="dot" cx="20" cy="20" r="5.5" fill="#ff5f56" style="animation-delay:0.0s" />
<circle class="dot" cx="38" cy="20" r="5.5" fill="#ffbd2e" style="animation-delay:0.3s" />
<circle class="dot" cx="56" cy="20" r="5.5" fill="#27c93f" style="animation-delay:0.6s" />
<text x="290.0" y="24" text-anchor="middle" class="title">⚡ yatinsingh2007@github ~ $ neofetch</text>
<line x1="0" y1="38" x2="580" y2="38" stroke="#30363d" stroke-width="1" />
<g class="row" style="animation-delay:0.10s">
<text x="22" y="50" class="key">⚡ Education</text>
<text x="136" y="50" class="val">BTech CSE (AI) '28 @ Newton School of Tech</text>
</g>
